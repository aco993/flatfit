version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev:
        dependency-type: development
      three:
        patterns: ['three', '@types/three', 'three-*']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # one pull request for all workflow actions instead of one per action
    groups:
      actions:
        patterns: ['*']
