name: Refresh catalogues

# Prices change, sales start and end. Every morning each price in every catalogue is re-checked on the
# store's own page (prices only, so product ids and saved choices stay valid). On Mondays the IKEA
# catalogues (DE, AT, HR) are rebuilt from the live pages as well, which brings in new products.
# The unit tests validate the new data; if they pass, the data is committed straight to main ("git scraping":
# the history of every price stays in the repository) and the site is redeployed. The app's "Refresh prices"
# button also reads these files from main, so an open page can pick up today's prices without a reload.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Also rebuild the IKEA catalogues (new products)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rebuild IKEA catalogues (Mondays, or when asked)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ inputs.rebuild }}" = "true" ]; then
            node scripts/ikea-catalog.mjs de
            node scripts/ikea-catalog.mjs at
            node scripts/ikea-catalog.mjs hr
          fi
      - name: Re-check every price
        run: |
          for c in rs ba hr de at; do node scripts/prices.mjs $c; done
      - run: npm test
      - name: Commit changed prices and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- src/data/catalogs && { echo 'no price changes'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/catalogs
          git commit -m "data: prices $(date -u +%F)"
          git push
          # pushes made with the workflow token do not start other workflows, so ask for the deploy explicitly
          gh workflow run ci.yml --ref main
